project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "!README.md"

website:
  title: "307102 Statistics for Business"
  description: "R track — University of Petra"
  page-navigation: true
  back-to-top-navigation: true

  sidebar:
    style: floating
    search: true
    collapse-level: 2
    contents:
      - text: "Course home"
        href: index.qmd
      - section: "1 — Intro to R Language"
        contents:
          - 1-Intro-to-R-Language/Intro-to-R.qmd
          - text: "Install guide"
            href: 1-Intro-to-R-Language/Install-Guide.qmd
      - section: "2 — Descriptive Statistics"
        contents:
          - 2-Descriptive-Statistics/Descriptive-Statistics.qmd
          - text: "Solutions (instructor)"
            href: 2-Descriptive-Statistics/Descriptive-Statistics-SOLUTIONS.qmd
      - section: "3 — Inferential Statistics"
        contents:
          - 3-Inferential-Statistics/3.1-Probability-Distributions.qmd
          - 3-Inferential-Statistics/3.2-Estimation-and-Confidence-Intervals.qmd
          - 3-Inferential-Statistics/3.3-Hypothesis-Testing.qmd
          - 3-Inferential-Statistics/3.4-Linear-Regression.qmd
      - section: "3 — Solutions (instructor)"
        contents:
          - 3-Inferential-Statistics/3.1-Probability-Distributions-SOLUTIONS.qmd
          - 3-Inferential-Statistics/3.2-Estimation-and-Confidence-Intervals-SOLUTIONS.qmd
          - 3-Inferential-Statistics/3.3-Hypothesis-Testing-SOLUTIONS.qmd
          - 3-Inferential-Statistics/3.4-Linear-Regression-SOLUTIONS.qmd

  page-footer:
    left: "307102 Descriptive Statistics for Business"
    right: "University of Petra"

format:
  html:
    theme:
      - cosmo
      - assets/petra-theme.scss
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    code-copy: true
    code-overflow: wrap
    code-line-numbers: false
    df-print: default
    fig-width: 7
    fig-height: 4.2
    fig-align: center
    link-external-newwindow: true
    smooth-scroll: true

# NOTE on lecture slides.
# The revealjs format is declared per teaching file, NOT here. A website project
# expects one primary format per page; adding revealjs at project level makes
# `quarto render` fail when it tries to move two outputs to the same path.
# Each teaching .qmd therefore carries its own block:
#
#   format:
#     html: default
#     revealjs:
#       output-file: <Name>-slides.html
#       theme: [default, ../assets/petra-reveal.scss]
#       ...
#
# Files without that block (SOLUTIONS, the install guide, the home page)
# produce a web page only, which is what we want.

execute:
  freeze: auto
  warning: false
  message: false
  echo: true

knitr:
  opts_chunk:
    comment: "#>"
    collapse: false

editor: source
