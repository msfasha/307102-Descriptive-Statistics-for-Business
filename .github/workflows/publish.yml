name: Publish course website

# Renders the Quarto project in 20261/ and publishes it to the gh-pages branch.
#
# No R is installed on the runner, and none is needed: the executed chunk
# results are committed under 20261/_freeze/, so Quarto reuses them. That makes
# the build fast and guarantees the published numbers match what you saw locally.
#
# If you change R code, render locally once (which updates _freeze/) and commit
# that alongside the .qmd change.

on:
  push:
    branches: [main]
    paths:
      - "20261/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:        # lets you trigger a rebuild by hand from the Actions tab

permissions:
  contents: write           # required to push the gh-pages branch

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render and publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: 20261            # the Quarto project lives in this subfolder
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
